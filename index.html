<meta property="og:title" content="GooshedCS">

<style>
  @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url(assets/BarlowCondensed-Bold.ttf) format("truetype"); font-display: swap; }
  @font-face { font-family: "Barlow Condensed"; font-weight: 500; src: url(assets/BarlowCondensed-Medium.ttf) format("truetype"); font-display: swap; }

  /* Brand tokens, from nade-pipeline/brand/tokens.css */
  :root {
    --goo: #9ad92a; --goo-deep: #5f8a19; --bone: #e8e8e2; --ash: #9a9a92;
    --pit: #191b18; --slab: #21241f; --seam: #353a31; --ink: #111111;
    --font: "Barlow Condensed", "Bahnschrift", "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--pit); }
  body {
    min-height: 100vh; color: var(--bone); font: 500 18px/1.4 var(--font);
    background: radial-gradient(ellipse 70% 45% at 50% 0%, #2a3320 0%, var(--pit) 70%);
    display: flex; justify-content: center; padding: 48px 16px 40px;
  }
  main { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; }

  .skull { width: 112px; height: 112px; animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-6px) rotate(2deg); } }
  .wordmark { width: min(300px, 80%); margin-top: 18px; }
  .tagline { margin-top: 6px; color: var(--ash); font-size: 19px; letter-spacing: .04em; text-transform: uppercase; }

  h2 {
    align-self: stretch; margin: 34px 0 12px; color: var(--ash);
    font-size: 14px; letter-spacing: .14em; text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
  }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--seam); }

  .links { align-self: stretch; display: flex; flex-direction: column; gap: 10px; }
  .link {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    background: var(--slab); border: 1px solid var(--seam); border-radius: 12px;
    color: var(--bone); text-decoration: none;
    transition: transform .18s cubic-bezier(.3,1.6,.5,1), border-color .15s, background .15s;
  }
  .link:hover, .link:focus-visible { transform: translateY(-2px) scale(1.015); border-color: var(--goo); background: #262a22; outline: none; }
  .link:active { transform: scale(.98); }
  .link svg { width: 26px; height: 26px; flex: none; fill: currentColor; }
  .link .text { display: flex; flex-direction: column; min-width: 0; }
  .link b { font-weight: 700; font-size: 21px; text-transform: uppercase; letter-spacing: .02em; line-height: 1.1; }
  .link small { color: var(--ash); font-size: 15px; }
  .link .go { margin-left: auto; color: var(--goo); font-weight: 700; font-size: 22px; }

  .soon { opacity: .6; cursor: default; pointer-events: none; }
  .chip {
    margin-left: auto; padding: 3px 9px; border-radius: 6px; background: var(--goo); color: var(--ink);
    font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; transform: skewX(-8deg);
  }

  footer { margin-top: 40px; color: var(--ash); font-size: 14px; text-align: center; }
  footer a { color: var(--ash); }

  @media (prefers-reduced-motion: reduce) { .skull { animation: none; } .link { transition: none; } }
</style>
</head>
